schemaVersion: 1.2

endpoints:
  - name: math-tutor-rest
    displayName: Math Tutor REST API
    service:
      basePath: /mathTutor
      port: 9090
    type: REST
    networkVisibilities:
      - Organization
      - Public

  - name: math-tutor-ws
    displayName: Math Tutor WebSocket
    service:
      basePath: /
      port: 9091
    type: WS
    networkVisibilities:
      - Project
      - Organization
      - Public
    schemaFilePath: asyncapi.yaml


